name: Submit Dependency Graph

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/buildSrc/**'
      - '**/gradle.properties'
      - '**/gradle/**'
      - '**/gradle.lockfile'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/dependency-submission.yaml'
  schedule:
    - cron: '20 3 * * 0,3,5'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.1
